<section id="achievements" class="achievements-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-label">Recognition</span>
      <h2 class="section-title">
        My <span class="text-gradient">Achievements</span>
      </h2>
      <p class="section-subtitle">
        Key milestones and honours earned along the journey.
      </p>
    </div>

    <!-- Achievement Cards -->
    <div class="achievements-grid">
      @for (item of achievements; track item.title; let i = $index) {
        <div class="achievement-card" [style.animation-delay]="i * 0.12 + 's'">
          <!-- Gradient border overlay (visible on hover) -->
          <div class="card-border-glow"></div>

          <div class="card-inner">
            <div class="icon-wrapper">
              <span class="icon-emoji">{{ item.emoji }}</span>
            </div>
            <h3 class="achievement-title">{{ item.title }}</h3>
            <p class="achievement-desc">{{ item.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
