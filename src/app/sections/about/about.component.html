<section id="about" class="about-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-label">Who I Am</span>
      <h2 class="section-title">
        About <span class="text-gradient">My Journey</span>
      </h2>
      <p class="section-subtitle">
        A quick look at where I've been, where I am, and where I'm heading.
      </p>
    </div>

    <!-- Cards Grid -->
    <div class="about-cards">
      @for (card of cards; track card.phase; let i = $index) {
        <div class="about-card" [style.animation-delay]="i * 0.15 + 's'">
          <div class="card-icon">{{ card.icon }}</div>
          <h3 class="card-title">{{ card.phase }}</h3>
          <div class="card-divider"></div>
          <p class="card-description">{{ card.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
